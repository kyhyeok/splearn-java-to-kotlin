spring:
  application:
    name: splearn
  flyway:
    enabled: true
    locations: classpath:db/migration
  docker:
    compose:
      lifecycle-management: start_only
  sql:
    init:
      mode: never

logging:
  level:
    root: WARN
    kimspring.splearn: INFO

jwt:
  # 기본값 없음 — 미설정 시 기동 실패가 의도된 동작이다
  secret: ${JWT_SECRET}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
